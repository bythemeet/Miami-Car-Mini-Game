<style>

<canvas id="c"></canvas><div id="vig"></div>
<div id="hud"><div><div id="money">$0</div><div id="hp"><div id="hpf"></div></div></div><div><div id="stars"></div><div id="loc" style="font:15px Monoton,cursive;color:#ff9ad0;text-align:right;margin-top:8px;text-shadow:0 0 10px #ff3d9a"></div><div id="radio">♪ Flamingo FM 98.7 (R)</div></div></div>

<div class="scr" id="title"><div id="sun"></div><h1>MIAMI HEAT</h1><p class="tag">1986. Palm trees, warm ocean, neon nights. Cruise the coast, grab the cash, lose the cops.</p><button class="btn" id="go">Start engine</button><p class="help">Arrows / WASD to drive · Space handbrake · R radio<br>Tip: the big payout is at the end of the pier 🌊</p></div>
<div class="scr off" id="over"><h1 style="font-size:clamp(36px,10vw,70px)">TOTALED</h1><p class="tag" id="res"></p><button class="btn" id="again">Drive again</button></div>
<script>
const $=i=>document.getElementById(i),cv=$('c'),x=cv.getContext('2d'),M=Math,R=M.random,PI=M.PI;
let W,H;function rs(){W=cv.width=innerWidth;H=cv.height=innerHeight}addEventListener('resize',rs);rs();
const G=420,RW=58,S=G-2*RW;
const hs=(i,j,s=0)=>{let h=(i*374761393+j*668265263+s*1274126177)|0;h=M.imul(h^(h>>>13),1274126177);return((h^(h>>>16))>>>0)/4294967296};
const PAL=['#ff77b7','#2de2e6','#ffd166','#b892ff','#ff9f68','#7df9c1'];
const E=1260+RW,T=E+6,SH=1454,PL=1720;
const cell=(px,py)=>{const ax=M.abs(px),ay=M.abs(py);
 if(ax>T||ay>T){if(px>0&&ay<26&&px<PL)return 0;return M.max(ax,ay)<SH?3:4}
 const i=M.floor(px/G),j=M.floor(py/G);if(i<-3||i>2||j<-3||j>2)return 0;
 const mx=px-i*G,my=py-j*G;if(mx<RW||mx>G-RW||my<RW||my>G-RW)return 0;return hs(i,j)<.2?1:2};
const sol=z=>z==2||z==4;
let pier,p,cars,cops,picks,money,wanted,health,timer,run=0,shake=0,fr=0,cam={x:0,y:0};const k={};
function rp(cx,cy,r,minD){const Cl=(n,m)=>M.max(-m,M.min(m,n));for(let t=0;t<25;t++){const v=R()<.5,s=R()<.5?1:-1;let X,Y,a;
 if(v){X=Cl(M.round((cx+(R()-.5)*2*r)/G),3)*G-s*20;Y=Cl(cy+(R()-.5)*2*r,1250);a=s>0?PI/2:-PI/2}
 else{Y=Cl(M.round((cy+(R()-.5)*2*r)/G),3)*G+s*20;X=Cl(cx+(R()-.5)*2*r,1250);a=s>0?0:PI}
 if(M.hypot(X-cx,Y-cy)>=minD)return{x:X,y:Y,a}}return{x:0,y:-1250,a:0}}

function reset(){p={x:0,y:0,vx:0,vy:0,a:0};money=0;wanted=0;health=100;timer=0;cops=[];
 cars=[];for(let i=0;i<16;i++)cars.push(mkCar(1100,300));
 picks=[];for(let i=0;i<14;i++)picks.push(rp(p.x,p.y,1100,250));pier={x:PL-34,y:0,on:1,t:0};run=1}
function crime(){wanted=M.min(5,wanted+1);timer=1500}
// audio
let ac,rad=0;const ST=[{n:'Flamingo FM 98.7',bpm:104,r:45,pat:[0,0,7,5,0,0,10,7]},{n:'Neon Palms 103.1',bpm:122,r:41,pat:[0,3,7,12,10,7,3,0]},{n:'Radio off'}];
function tone(f,t,d,ty,g,fl){const o=ac.createOscillator(),v=ac.createGain(),b=ac.createBiquadFilter();o.type=ty;o.frequency.value=f;b.type='lowpass';b.frequency.value=fl||2000;
 v.gain.setValueAtTime(g,t);v.gain.exponentialRampToValueAtTime(.001,t+d);o.connect(b);b.connect(v);v.connect(ac.destination);o.start(t);o.stop(t+d)}
let step=0,nxt=0;
setInterval(()=>{if(!ac||rad==2)return;const s=ST[rad],d=60/s.bpm/2;if(nxt<ac.currentTime)nxt=ac.currentTime+.05;
 while(nxt<ac.currentTime+.2){const m=s.r+s.pat[step%8],f=n=>440*2**((n-69)/12);
  tone(f(m),nxt,d*.95,'sawtooth',.11,500);
  if(step%2==0){const o=ac.createOscillator(),v=ac.createGain();o.frequency.setValueAtTime(140,nxt);o.frequency.exponentialRampToValueAtTime(40,nxt+.12);v.gain.setValueAtTime(.3,nxt);v.gain.exponentialRampToValueAtTime(.001,nxt+.15);o.connect(v);v.connect(ac.destination);o.start(nxt);o.stop(nxt+.16)}
  tone(f(m+12+[0,7,12,7][step%4]),nxt,d*.6,'square',.03,3000);nxt+=d;step++}},50);
function radio(){rad=(rad+1)%3;$('radio').textContent='♪ '+ST[rad].n+' (R)'}
$('radio').onclick=radio;
function begin(){if(!ac)ac=new (window.AudioContext||window.webkitAudioContext)();ac.resume();$('title').classList.add('off');$('over').classList.add('off');reset()}
$('go').onclick=begin;$('again').onclick=begin;
const map={ArrowUp:'up',KeyW:'up',ArrowDown:'dn',KeyS:'dn',ArrowLeft:'l',KeyA:'l',ArrowRight:'r',KeyD:'r',Space:'hb'};

document.querySelectorAll('#pad button').forEach(b=>{const n=b.dataset.k;b.onpointerdown=e=>{k[n]=1;b.setPointerCapture(e.pointerId)};['pointerup','pointercancel','lostpointercapture'].forEach(ev=>b.addEventListener(ev,()=>k[n]=0))});
function step1(){fr++;
 const hx=M.cos(p.a),hy=M.sin(p.a),acc=(k.up?.3:0)-(k.dn?.22:0);
 let fwd=p.vx*hx+p.vy*hy;p.vx+=hx*acc;p.vy+=hy*acc;
 const lat=-p.vx*hy+p.vy*hx,gr=k.hb?.03:.13;p.vx+=hy*lat*gr;p.vy-=hx*lat*gr;
 const st=(k.r?1:0)-(k.l?1:0);p.a+=st*.05*M.max(-1,M.min(1,fwd/4))*(k.hb?1.5:1);

 const ox=p.x,oy=p.y;p.x+=p.vx;p.y+=p.vy;
 if(sol(cell(p.x+M.sign(p.vx)*18,p.y))||sol(cell(p.x,p.y+M.sign(p.vy)*18))){const sp=M.hypot(p.vx,p.vy);p.x=ox;p.y=oy;p.vx*=-.35;p.vy*=-.35;if(sp>3){health-=sp*1.2;shake=8}}
 const sp=M.hypot(p.vx,p.vy);
 cars.forEach((c,i)=>{
  if(c.stun>0){c.stun--;c.a+=.12;c.x+=c.kx;c.y+=c.ky;c.kx*=.93;c.ky*=.93;if(!c.stun)c.a=M.round(c.a/(PI/2))*PI/2}
  else{const nx=c.x+M.cos(c.a)*c.v,ny=c.y+M.sin(c.a)*c.v;if(M.abs(nx)>1275||M.abs(ny)>1275){c.a+=PI;if(M.abs(M.cos(c.a))<.5)c.x=2*M.round(c.x/G)*G-c.x;else c.y=2*M.round(c.y/G)*G-c.y}else if(sol(cell(nx,ny)))cars[i]=mkCar(1200,700);else{c.x=nx;c.y=ny}}
  if(M.hypot(c.x-p.x,c.y-p.y)>1500)cars[i]=mkCar(1200,700);
  if(!c.stun&&M.hypot(c.x-p.x,c.y-p.y)<36){c.stun=90;c.kx=p.vx*.8;c.ky=p.vy*.8;p.vx*=.5;p.vy*=.5;health-=sp*.7;shake=8;if(sp>2.5)crime()}});
 while(cops.length<wanted*2){const q=rp(p.x,p.y,900,650);cops.push({...q,v:3,cop:1,col:'#f4f4ff'})}
 cops=cops.filter(c=>{const d=M.hypot(p.x-c.x,p.y-c.y);if(d>1800||(wanted==0&&d>800))return false;
  let df=M.atan2(p.y-c.y,p.x-c.x)-c.a;df=M.atan2(M.sin(df),M.cos(df));
  if(wanted>0){c.a+=M.max(-.07,M.min(.07,df));c.v=M.min(c.v+.15,5.8+wanted*.5)}else c.v=M.min(c.v+.1,4);
  const nx=c.x+M.cos(c.a)*c.v,ny=c.y+M.sin(c.a)*c.v;if(sol(cell(nx,ny))){c.a+=.35;c.v*=.6}else{c.x=nx;c.y=ny}
  if(d<36){health-=.3;shake=4;p.vx+=(p.x-c.x)/d*.8;p.vy+=(p.y-c.y)/d*.8;c.v*=.5}return true});
 picks.forEach((q,i)=>{if(M.hypot(q.x-p.x,q.y-p.y)>1300)picks[i]=rp(p.x,p.y,1100,500);
  else if(M.hypot(q.x-p.x,q.y-p.y)<34){money+=250;picks[i]=rp(p.x,p.y,1100,500);if(ac&&rad<2||ac)tone(1046,ac.currentTime,.2,'triangle',.15,4000)}});
 if(!pier.on){if(--pier.t<=0)pier.on=1}else if(M.hypot(pier.x-p.x,pier.y-p.y)<42){money+=1000;pier.on=0;pier.t=1800;if(ac)tone(1318,ac.currentTime,.4,'triangle',.18,4000)}
 if(wanted>0&&--timer<=0){wanted--;timer=700}
 cam.x+=(p.x+p.vx*14-cam.x)*.08;cam.y+=(p.y+p.vy*14-cam.y)*.08;shake*=.85;
 if(health<=0){run=2;$('res').textContent='You earned $'+money+' before the streets caught up.';$('over').classList.remove('off')}}
function car(c,me){x.save();x.translate(c.x,c.y);x.rotate(c.a);
 if(me){x.fillStyle='rgba(255,240,180,.16)';x.beginPath();x.moveTo(22,-9);x.lineTo(170,-55);x.lineTo(170,55);x.lineTo(22,9);x.fill();x.shadowColor='#ff3d9a';x.shadowBlur=22}
 x.fillStyle='rgba(0,0,0,.35)';x.beginPath();x.roundRect(-22,-9,48,24,7);x.fill();x.shadowBlur=me?22:0;
 x.fillStyle=me?'#ff3d9a':c.col;x.beginPath();x.roundRect(-24,-12,48,24,7);x.fill();x.shadowBlur=0;
 x.fillStyle='rgba(20,10,50,.85)';x.fillRect(3,-9,10,18);x.fillRect(-15,-9,7,18);
 if(c.cop){x.fillStyle='#1a1a3a';x.fillRect(-24,-12,10,24);const f=(fr>>3)&1;x.fillStyle=f?'#ff2d55':'#2d7bff';x.fillRect(-2,-11,6,10);x.fillStyle=f?'#2d7bff':'#ff2d55';x.fillRect(-2,1,6,10)}
 x.restore()}
const PP=['#ffb3d1','#8ff0e6','#ffe29a','#c9b3ff','#ffc09f','#a8ffd9'],pq=[];
const palm=(px,py,s,h)=>pq.push([px,py,s,h]);
function drawPalms(){pq.forEach(([px,py,s,h])=>{x.save();x.translate(px,py);x.fillStyle='rgba(0,0,0,.25)';x.beginPath();x.ellipse(12*s,12*s,18*s,9*s,0,0,7);x.fill();x.lineCap='round';const sw=M.sin(fr/45+h*9)*.1;
 for(let f=0;f<7;f++){const a=f*PI*2/7+h*6+sw,n=(34+(f%2)*9)*s;x.strokeStyle=f%2?'#0d9a68':'#22e6a4';x.lineWidth=7*s;x.beginPath();x.moveTo(0,0);x.quadraticCurveTo(M.cos(a)*n*.55,M.sin(a)*n*.55-5*s,M.cos(a)*n,M.sin(a)*n);x.stroke()}
 x.fillStyle='#8a5a2c';x.beginPath();x.arc(0,0,5*s,0,7);x.fill();x.restore()});pq.length=0}
const dot=(a,b,r,c)=>{x.fillStyle=c;x.beginPath();x.arc(a,b,r,0,7);x.fill()};
function draw(){x.setTransform(1,0,0,1,0,0);x.fillStyle='#0d3a7a';x.fillRect(0,0,W,H);
 const sp=M.hypot(p.vx,p.vy),sc=M.min(W,H)/(W<H?520:660)*(1-M.min(sp,10)*.018),sx=(R()-.5)*shake,sy=(R()-.5)*shake;
 x.translate(W/2+sx,H/2+sy);x.scale(sc,sc);x.translate(-cam.x,-cam.y);
 const l=cam.x-W/2/sc,r=cam.x+W/2/sc,t=cam.y-H/2/sc,b=cam.y+H/2/sc,i0=M.floor(l/G),i1=M.floor(r/G),j0=M.floor(t/G),j1=M.floor(b/G);
 x.fillStyle='#19b8c8';x.beginPath();x.roundRect(-SH-120,-SH-120,2*SH+240,2*SH+240,150);x.fill();
 x.fillStyle='#fff';for(let gx=M.floor(l/70);gx<=r/70;gx++)for(let gy=M.floor(t/70);gy<=b/70;gy++){const v=hs(gx,gy,7);if(v>.8){x.globalAlpha=.3+.3*M.sin(fr/18+v*40);x.fillRect(gx*70+v*30,gy*70,14,2)}}x.globalAlpha=1;
 const wv=M.sin(fr/35)*7;x.strokeStyle='rgba(255,255,255,.6)';x.lineWidth=6;x.beginPath();x.roundRect(-SH-8-wv,-SH-8-wv,2*SH+16+2*wv,2*SH+16+2*wv,70);x.stroke();
 const w2=M.sin(fr/35+2.2)*7+34;x.strokeStyle='rgba(255,255,255,.25)';x.lineWidth=3;x.beginPath();x.roundRect(-SH-w2,-SH-w2,2*SH+2*w2,2*SH+2*w2,90);x.stroke();
 x.fillStyle='#f7d9a6';x.beginPath();x.roundRect(-SH,-SH,2*SH,2*SH,60);x.fill();x.strokeStyle='#e9bf86';x.lineWidth=10;x.stroke();
 for(let gx=M.floor(l/110);gx<=r/110;gx++)for(let gy=M.floor(t/110);gy<=b/110;gy++){const v=hs(gx,gy,11),px=gx*110+hs(gx,gy,12)*70,py=gy*110+hs(gx,gy,13)*70,d=M.max(M.abs(px),M.abs(py));
  if(d<T+30||d>SH-35||(px>0&&M.abs(py)<70))continue;const c=PP[M.floor(hs(gx,gy,14)*6)];
  if(v<.16){x.fillStyle='rgba(0,0,0,.2)';x.beginPath();x.ellipse(px+10,py+12,24,14,0,0,7);x.fill();dot(px,py,24,c);x.fillStyle='rgba(255,255,255,.8)';for(let q=0;q<4;q++){x.beginPath();x.moveTo(px,py);x.arc(px,py,24,q*PI/2,q*PI/2+PI/4);x.fill()}}
  else if(v<.3){x.save();x.translate(px,py);x.rotate(v*20);x.fillStyle=c;x.fillRect(-11,-20,22,40);x.fillStyle='#fff';x.fillRect(-11,-4,22,6);x.restore()}
  else if(v<.4)palm(px,py,1.15,v)}
 x.fillStyle='#e6b48f';x.fillRect(-T-24,-T-24,2*T+48,2*T+48);x.fillStyle='#2b2143';x.fillRect(-T,-T,2*T,2*T);
 x.fillStyle='#a8744a';x.fillRect(T,-26,PL-T,52);x.strokeStyle='#6d4426';x.lineWidth=2;x.beginPath();for(let q=T;q<PL;q+=20){x.moveTo(q,-26);x.lineTo(q,26)}x.stroke();
 x.strokeStyle='#fff';x.lineWidth=3;x.strokeRect(T,-26,PL-T,52);
 for(let q=T+50;q<PL;q+=90)for(const s of[-26,26]){dot(q,s,16,'rgba(255,61,154,.35)');dot(q,s,5,'#ff3d9a')}
 x.strokeStyle='rgba(255,209,102,.7)';x.lineWidth=3;x.setLineDash([26,26]);x.beginPath();
 for(let i=M.max(-3,i0);i<=M.min(3,i1+1);i++){x.moveTo(i*G,-E);x.lineTo(i*G,E)}for(let j=M.max(-3,j0);j<=M.min(3,j1+1);j++){x.moveTo(-E,j*G);x.lineTo(E,j*G)}x.stroke();x.setLineDash([]);
 for(let i=M.max(-3,i0);i<=M.min(2,i1);i++)for(let j=M.max(-3,j0);j<=M.min(2,j1);j++){const bx=i*G+RW,by=j*G+RW,h=hs(i,j),c=PP[M.floor(hs(i,j,3)*6)];
  x.fillStyle='#e8d3c0';x.fillRect(bx-14,by-14,S+28,S+28);
  [[-16,-16],[S+16,-16],[-16,S+16],[S+16,S+16],[S/2,-16],[S/2,S+16],[-16,S/2],[S+16,S/2]].forEach((o,n)=>palm(bx+o[0],by+o[1],.85,hs(i,j,20+n)));
  if(h<.2){x.fillStyle='#1fb583';x.fillRect(bx,by,S,S);x.fillStyle='#4fd1e6';x.beginPath();x.ellipse(bx+S/2,by+S/2,70,45,0,0,7);x.fill();x.strokeStyle='#fff';x.lineWidth=3;x.stroke();
   for(let n=0;n<3;n++)palm(bx+40+hs(i,j,n+5)*(S-80),by+30+hs(i,j,n+9)*(S-60),1,n+h)}
  else{x.fillStyle='rgba(0,0,0,.35)';x.fillRect(bx+12,by+12,S,S);x.fillStyle=c;x.fillRect(bx,by,S,S);
   const ins=12+h*30;x.fillStyle='rgba(255,255,255,.38)';x.fillRect(bx+ins,by+ins,S-ins*2,S-ins*2);
   x.strokeStyle=h>.6?'#ff3d9a':'#2de2e6';x.lineWidth=4;x.strokeRect(bx+ins,by+ins,S-ins*2,S-ins*2);x.fillStyle='rgba(255,255,255,.6)';
